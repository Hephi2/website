<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 72">
  <!-- Eye on front antenna tip -->
  <circle cx="82" cy="17" r="4.8" fill="white"/>
  <circle cx="83" cy="17.5" r="2.4" fill="#1A1A2E"/>
  <circle cx="81" cy="15.5" r="1.2" fill="white"/>
  <!-- Eyebrow above front eye -->
  <path d="M 78.5 11.5 Q 82 9.5 85.5 11.5" fill="none" stroke="#1A1A2E" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Eye on back antenna tip -->
  <circle cx="104" cy="18" r="4.8" fill="white"/>
  <circle cx="105" cy="18.5" r="2.4" fill="#1A1A2E"/>
  <circle cx="103" cy="16.5" r="1.2" fill="white"/>
  <!-- Eyebrow above back eye -->
  <path d="M 100.5 12.5 Q 104 10.5 107.5 12.5" fill="none" stroke="#1A1A2E" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Smile on face -->
  <path d="M 83 52 Q 88 58.5 94 52" fill="none" stroke="#1A1A2E" stroke-width="2" stroke-linecap="round"/>

  <!-- Blush on cheek -->
  <ellipse cx="95" cy="50" rx="4.5" ry="2.5" fill="#FF8A80" opacity="0.40"/>
</svg>
