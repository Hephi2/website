<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 72">
  <!-- Body / foot -->
  <ellipse cx="54" cy="58" rx="42" ry="11" fill="white"/>
  <!-- Shell -->
  <circle cx="38" cy="35" r="25" fill="white"/>
  <!-- Shell spiral rings (subtle, semi-transparent for tinting effect) -->
  <circle cx="38" cy="35" r="15" fill="none" stroke="white" stroke-width="2" opacity="0.25"/>
  <circle cx="38" cy="35" r="7" fill="none" stroke="white" stroke-width="1.5" opacity="0.25"/>
  <!-- Neck connector -->
  <ellipse cx="72" cy="50" rx="14" ry="9" fill="white"/>
  <!-- Head -->
  <circle cx="91" cy="48" r="12" fill="white"/>
  <!-- Back antenna -->
  <line x1="96" y1="38" x2="104" y2="20" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="104" cy="18" r="4" fill="white"/>
  <!-- Front antenna -->
  <line x1="87" y1="38" x2="82" y2="19" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="82" cy="17" r="4" fill="white"/>
</svg>
